name: Build Android AAR

on:
  push:
    branches: [ "main" ]  # 触发分支
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # 确保包含子模块

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Install Android NDK r21e
      run: |
        echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
        echo "export ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/21.4.7075529" >> $GITHUB_ENV

    - name: Grant gradlew execute permission
      run: chmod +x android/gradlew

    - name: Build AAR
      working-directory: ./android
      run: ./gradlew assembleRelease  # 关键构建命令

    - name: Upload AAR artifact
      uses: actions/upload-artifact@v3
      with:
        name: nodejs-mobile-build
        path: |
          android/build/outputs/aar/*.aar
          android/build/intermediates/merged_native_libs/release/out/lib/*
