name: Build AAR and Publish Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (格式：v1.0.0)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Install NDK r21e
      run: |
        echo "y" | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
        echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

    # 新增：安装全局 Gradle
    - name: Install Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 7.5.1  # 与项目兼容的版本

    # 修改：使用全局 gradle 命令
    - name: Build AAR with Global Gradle
      working-directory: ./android
      run: |
        gradle assembleRelease  # 不再依赖 gradlew

    - name: Upload AAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nodejs-mobile-build
        path: android/build/outputs/aar/*.aar

  create_release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download AAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: nodejs-mobile-build

    - name: Get Release Tag
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_ENV
        else
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        files: |
          *.aar  # 自动匹配下载的 AAR 文件
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
