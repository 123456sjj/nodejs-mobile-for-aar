name: Build AAR and Publish Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (格式：v1.0.0)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Install NDK r21e
      run: |
        echo "y" | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
        echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

    - name: Build AAR
      working-directory: ./android
      run: ./gradlew assembleRelease

    - name: Upload AAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nodejs-mobile-build
        path: android/build/outputs/aar/*.aar

  create_release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download AAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: nodejs-mobile-build

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}  # 关键修复
        name: "Release ${{ github.event.inputs.release_tag || github.ref_name }}"
        body: "Node.js Mobile Android AAR 构建版本"
        draft: false
        prerelease: ${{ contains(github.event.inputs.release_tag || github.ref_name, '-') }}
        files: |
          *.aar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
