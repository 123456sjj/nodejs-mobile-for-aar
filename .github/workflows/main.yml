     # 关键修复：动态生成 Gradle 项目文件
     - name: Initialize Gradle Project
       working-directory: ./android
       run: |
         if [ ! -f "settings.gradle" ]; then
           gradle init --type basic --project-name nodejs-mobile
         fi
         cat << EOF > settings.gradle
         pluginManagement {
             repositories {
                 google()
                 mavenCentral()
                 gradlePluginPortal()
             }
         }
         rootProject.name = "nodejs-mobile"
         EOF
 
         # 生成 Android 库的 build.gradle
         cat << EOF > build.gradle
         plugins {
             id 'com.android.library'
             id 'com.android.library' version '8.2.0'
         }
 
         repositories {
             google()
             mavenCentral()
         }
 
         android {
             compileSdk 33
             namespace 'com.example.nodejsmobile'
 
             defaultConfig {
                 minSdk 24
                 targetSdk 33
             }
 
             buildTypes {
                 release {
                     minifyEnabled false
                 }
             }
         }
         EOF
 
     - name: Build AAR with Global Gradle
       working-directory: ./android
       run: gradle assembleRelease
 
     - name: Upload AAR Artifact
       uses: actions/upload-artifact@v4
       with:
         name: nodejs-mobile-build
         path: android/build/outputs/aar/*.aar
 
   create_release:
